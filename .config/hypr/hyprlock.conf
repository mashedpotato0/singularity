# hyprlock configuration with dynamic wallpaper theming

source = $HOME/.config/hypr/hyprpaper.conf
source = $HOME/.config/hypr/conf/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = $wall
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = <span foreground="##888899">Password...</span>
    hide_input = false
    check_color = $accent_green
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $accent_yellow
    position = 0, -60
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $on_surface
    font_size = 80
    font_family = Adwaita Sans, FreeSans, sans-serif
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = $secondary
    font_size = 20
    font_family = Adwaita Sans, FreeSans, sans-serif
    position = 0, 75
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    text = Hi, $USER
    color = $primary
    font_size = 17
    font_family = Adwaita Sans, FreeSans, sans-serif
    position = 0, 5
    halign = center
    valign = center
}
